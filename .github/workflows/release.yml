name: release

# Push a tag like v0.2.0 to build the plugin and attach the jar to the
# GitHub release of that name (created if it does not exist yet). A plain
# .jar from a release downloads without the "dangerous file" block Chrome
# shows for the zipped Actions artifact.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: mvn -B package
      - name: Attach jar to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar=$(ls target/bigdataviewer-movie-producer-*.jar | grep -v -e sources -e javadoc | head -n 1)
          out="bigdataviewer-movie-producer-${GITHUB_REF_NAME#v}.jar"
          cp "$jar" "$out"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$out" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$out" --title "$GITHUB_REF_NAME" --generate-notes
          fi
